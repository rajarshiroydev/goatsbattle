name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - name: TheStatsAPI feature simulation
        run: npm run test:feature:stats-api
      - name: Worker and Durable Object tests
        run: npm run test:worker
      # Both builds are intentional: Astro flattens environment-specific Worker
      # bindings at build time, so production verification cannot validate the
      # separate preview config used by the Wrangler dry run.
      - run: npm run worker:verify-build:production
      - run: npm run worker:dry-run
